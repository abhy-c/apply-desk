[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apply-desk"
version = "0.4.0"
description = "A local job-search workspace for sourcing, review, application drafts, and follow-ups."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
resume = ["lxml>=6.0", "pypdf>=6.0"]

[project.scripts]
job-system = "job_app_system.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
job_app_system = ["assets/web/*", "assets/examples/*", "assets/*.applescript"]
